<style>
  :root{
    --teal:#0c7477; --teal-d:#0d5c63; --azul:#114656;
    --verde1:#94d05e; --verde2:#119b67; --lima:#bfd83e;
    --bg:#f4f7f8; --txt:#1f2a33; --muted:#6b7280; --line:#e3e9ec;
    --rojo:#dc4c4c; --naranja:#e8892b;
    --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font)}
  body{overscroll-behavior-y:contain}
  button,input,textarea{font-family:var(--font)}
  button{cursor:pointer}
  .vista{display:none}
  .vista.on{display:block}

  /* ===== LOGIN ===== */
  #vLogin{min-height:100vh;padding:28px 16px;background:linear-gradient(180deg,#e9f3f3,var(--bg))}
  #vLogin.on{display:flex;align-items:center;justify-content:center}
  .login{background:#fff;border-radius:28px;padding:44px 28px 26px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(12,116,119,.10)}
  .login .logo{display:block;width:118px;margin:0 auto}
  .login .sep{width:72px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--lima));margin:28px auto 18px}
  .login h1{text-align:center;color:var(--azul);font-size:28px;font-weight:900;margin:0}
  .login .sub{text-align:center;color:var(--muted);font-size:16px;margin:4px 0 26px}
  .login label{display:block;font-weight:700;font-size:16px;margin:18px 0 8px}
  .inp{display:flex;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#f4f7f7;transition:.2s}
  .inp:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px rgba(12,116,119,.12)}
  .inp .ic{width:62px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#2a6f80,#173f4d)}
  .inp input{flex:1;border:0;background:transparent;padding:17px 16px;font-size:17px;outline:none;min-width:0}
  .inp button{border:0;background:transparent;padding:0 16px;font-size:20px}
  .recordar{display:flex;align-items:center;gap:10px;margin:22px 0;font-size:16px;color:#4b5563}
  .recordar input{width:22px;height:22px;accent-color:var(--teal)}
  .btn-login{width:100%;border:0;border-radius:40px;padding:19px;font-size:17px;font-weight:900;letter-spacing:1px;color:#fff;background:linear-gradient(135deg,#177b8b,#0f5262);box-shadow:0 8px 20px rgba(15,82,98,.3)}
  .btn-login:disabled{opacity:.6}
  .login .pie{border-top:1px solid var(--line);margin-top:26px;padding-top:16px;text-align:center;color:#9ca3af;font-size:14px}
  .login .pie .seg{color:#9cc35a;font-weight:700;margin-top:6px}
  .login .pie a{display:inline-block;margin-top:10px;color:var(--muted);font-size:12px;text-decoration:underline}
  .btn-instalar{width:100%;margin-top:12px;border:2px solid var(--verde2);background:#fff;color:var(--verde2);border-radius:40px;padding:15px;font-size:15px;font-weight:800}
  .err-login{display:none;background:#fdecec;color:var(--rojo);border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;margin-top:14px;text-align:center}

  /* ===== BARRA SUPERIOR ===== */
  .top{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;gap:12px;padding:14px 18px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
  .top img{width:42px}
  .top .marca{flex:1;line-height:1.1;min-width:0;white-space:nowrap;overflow:hidden}
  .top .marca span{display:block;overflow:hidden;text-overflow:ellipsis}
  .top .marca b{display:block;color:var(--teal-d);font-size:21px;font-weight:900}
  .top .marca span{color:#7b8790;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
  .top .back{border:0;background:#eef5f5;color:var(--teal-d);width:42px;height:42px;border-radius:12px;font-size:22px;font-weight:900;display:none}
  .burger{border:0;background:transparent;width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 6px}
  .burger i{display:block;height:4px;border-radius:3px;background:var(--teal-d)}

  /* ===== MENÚ LATERAL ===== */
  .velo{position:fixed;inset:0;background:rgba(30,40,45,.45);z-index:30;opacity:0;pointer-events:none;transition:.25s}
  .velo.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:78%;max-width:340px;background:#fff;z-index:31;transform:translateX(100%);transition:transform .28s ease;padding:56px 26px 26px;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .perfil{display:flex;align-items:center;gap:16px;padding-bottom:28px;border-bottom:1px solid var(--line)}
  .avatar{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--azul));display:grid;place-items:center;font-size:30px;flex:0 0 auto}
  .perfil b{display:block;font-size:20px;font-weight:900}
  .perfil span{color:var(--muted);font-size:15px}
  .menu{list-style:none;margin:14px 0;padding:0 0 14px;border-bottom:1px solid var(--line)}
  .menu button{width:100%;display:flex;align-items:center;gap:18px;border:0;background:transparent;padding:18px 4px;font-size:17px;font-weight:700;color:var(--txt);text-align:left;border-radius:12px}
  .menu button:active{background:#f1f7f7}
  .menu .em{font-size:24px;width:30px;text-align:center}
  .salir{color:var(--rojo)!important}

  /* ===== INICIO: SUCURSALES ===== */
  main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
  .saludo{margin:6px 6px 18px}
  .saludo h2{margin:0;font-size:22px;font-weight:900;color:var(--azul)}
  .saludo p{margin:2px 0 0;color:var(--muted)}
  .card-suc{background:#fff;border-radius:22px;padding:30px 28px;margin-bottom:22px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.05)}
  .card-suc .em{font-size:58px;line-height:1}
  .card-suc h3{margin:14px 0 6px;font-size:30px;font-weight:900;letter-spacing:.5px}
  .card-suc p{margin:0 0 6px;color:var(--muted);font-size:17px}
  .card-suc .cnt{display:inline-block;margin:6px 0 20px;padding:6px 14px;border-radius:20px;background:#eef6ea;color:#3f7d2a;font-weight:800;font-size:14px}
  .card-suc .cnt.pend{background:#fff1e3;color:#a85a10}
  .btn-verde{width:100%;border:0;border-radius:18px;padding:20px;font-size:19px;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--verde1),var(--verde2));box-shadow:0 6px 16px rgba(17,155,103,.22)}
  .btn-verde:disabled{opacity:.6}
  .cargando{text-align:center;padding:50px 10px;color:var(--muted)}
  .spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .vacio{text-align:center;color:var(--muted);padding:40px 10px;font-size:16px}
  .vacio b{display:block;font-size:46px;margin-bottom:8px}

  /* ===== LISTA DE PENDIENTES ===== */
  .resumen{background:#fff;border-radius:20px;padding:18px 20px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
  .resumen .fila{display:flex;justify-content:space-between;align-items:baseline}
  .resumen h3{margin:0;font-size:22px;font-weight:900}
  .resumen .pct{font-weight:900;color:var(--verde2);font-size:18px}
  .resumen p{margin:2px 0 10px;color:var(--muted);font-size:14px}
  .barra{height:10px;background:#edf2f3;border-radius:8px;overflow:hidden}
  .barra div{height:100%;width:0;background:linear-gradient(90deg,var(--verde1),var(--verde2));transition:width .4s}
  .buscar{display:flex;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:0 6px 0 16px;margin-bottom:10px}
  .buscar:focus-within{border-color:var(--teal)}
  .buscar input{flex:1;border:0;outline:none;padding:16px 8px;font-size:17px;background:transparent;min-width:0}
  .buscar button{border:0;background:#eef2f3;width:32px;height:32px;border-radius:50%;color:var(--muted);display:none}
  .info{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin:0 6px 10px}
  .info button{border:0;background:transparent;color:var(--teal);font-weight:800;font-size:14px}
  .prod{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.04);border:2px solid transparent}
  .prod:active{border-color:var(--verde1)}
  .prod .t{flex:1;min-width:0}
  .prod .cod{font-size:13px;font-weight:800;color:var(--teal)}
  .prod .nom{font-weight:800;font-size:16px;margin:2px 0 8px;line-height:1.25}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:12px;padding:4px 9px;border-radius:8px;background:#eef4f5;color:var(--azul);font-weight:700}
  .tag.multi{background:var(--naranja);color:#fff}
  .tag.lock{background:#fdecec;color:var(--rojo)}
  .prod.bloq{opacity:.6}
  .prod.bloq .flecha{font-size:20px}
  .prod .flecha{font-size:26px;color:#b8c4c9;font-weight:700}
  .mas{text-align:center;color:var(--muted);font-size:13px;padding:10px}

  /* ===== FICHA (MODAL) ===== */
  .modal{position:fixed;inset:0;background:rgba(30,40,45,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:22px 20px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:sube .25s ease-out}
  @keyframes sube{from{transform:translateY(40px);opacity:.4}}
  .asa{width:44px;height:5px;border-radius:4px;background:#d9e1e4;margin:-8px auto 14px}
  .sheet .cod{font-weight:800;color:var(--teal);font-size:14px}
  .sheet h3{margin:4px 0 14px;font-size:20px;font-weight:900;line-height:1.25}
  .aviso{background:#fff4e6;color:#9a5a12;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;margin-bottom:14px}
  .bloque{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .bloque.err{border-color:var(--rojo)}
  .bloque .fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .fecha{background:linear-gradient(135deg,#177b8b,#0f5262);color:#fff;padding:8px 14px;border-radius:12px;font-weight:900;font-size:17px}
  .fecha small{font-weight:700;opacity:.75;font-size:11px;margin-right:6px}
  .actual{text-align:right;color:var(--muted);font-size:13px}
  .actual b{display:block;font-size:22px;color:var(--azul);font-weight:900}
  .sheet label{display:block;font-size:14px;font-weight:800;margin:12px 0 6px}
  .campo,.sheet textarea{width:100%;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:#f4f7f7;outline:none;color:var(--txt)}
  .campo:focus,.sheet textarea:focus{border-color:var(--teal);background:#fff}
  .campo:disabled{color:#a3adb2;background:#eceff0}
  .sheet textarea{font-size:15px;min-height:58px;resize:vertical}
  .row{display:flex;gap:10px} .row .campo{flex:1;min-width:0}
  .btn-cero{border:2px solid var(--rojo);background:#fff;color:var(--rojo);border-radius:14px;font-weight:900;font-size:13px;padding:0 12px}
  .btn-cero.on{background:var(--rojo);color:#fff}
  .nota{font-size:13px;color:var(--muted);margin-top:6px;min-height:16px}
  .acciones{display:flex;gap:10px;position:sticky;bottom:-16px;background:#fff;padding:12px 0 4px}
  .btn-gris{flex:1;border:0;border-radius:18px;padding:18px;font-size:16px;font-weight:800;background:#eef2f3;color:var(--azul)}
  .acciones .btn-verde{flex:2;width:auto}
  .invalid{border-color:var(--rojo)!important;animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  .ptr{position:fixed;top:0;left:50%;transform:translate(-50%,-60px);z-index:25;background:#fff;color:var(--teal);font-weight:800;font-size:14px;padding:10px 18px;border-radius:30px;box-shadow:0 6px 18px rgba(0,0,0,.15);transition:transform .15s;display:flex;align-items:center;gap:8px;pointer-events:none}
  .ptr .ic{display:inline-block;transition:transform .15s}
  .ptr.listo .ic{transform:rotate(180deg)}
  .ptr.girando .ic{animation:gira .8s linear infinite}
  .toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-150px);background:var(--azul);color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:60;transition:transform .3s;max-width:92%;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.2)}
  .toast.show{transform:translate(-50%,0)} .toast.err{background:var(--rojo)} .toast.ok{background:var(--verde2)}
</style>
</head>

<script>
/* ================= CONFIGURACIÓN ================= */
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbwCJ8rMuCD8yuJpzkmSEesZHDHfcTYQSf2VXiVmXfjhvJ8XWNUX8TGbGR0kjNiM2ifsVA/exec';   // Pega aquí la URL /exec para que todos los teléfonos ya vengan configurados
const MAX_LISTA   = 80;
const ICONOS = { FARMACIA:'💊', MERCADO:'📦', BODEGA:'🏭', CENTRAL:'🏢' };

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k) ?? sessionStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v, sesion){ try{ (sesion ? sessionStorage : localStorage).setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(e){} }
};
let cfg = LS.get('vv_cfg', { url: DEFAULT_URL, token: '' });
if(!cfg.url && DEFAULT_URL) cfg.url = DEFAULT_URL;
let user = LS.get('vv_user', null);
let sucursal = '', productos = [], total = 0, pend = 0, actual = null, ventanaTxt = '';
/* ===== Tiempo real ===== */
const CADA_SEG = 1;   // cada cuántos segundos se revisan cambios de otras sesiones
const SESION = (() => { let s = localStorage.getItem('vv_sesion'); if(!s){ s = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); try{ localStorage.setItem('vv_sesion', s); }catch(e){} } return s; })();
let locks = [], refrescoPendiente = false, ultimoVisto = 0, consultando = false;
function lockDe(codigo){ const c = String(codigo).trim().toUpperCase(); return locks.find(l => l.hoja === sucursal && l.codigo === c && l.sesion !== SESION); }

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s ?? '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function toast(msg, tipo=''){
  const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + tipo;
  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2800);
}
function marcar(el){ el.classList.remove('invalid'); void el.offsetWidth; el.classList.add('invalid'); }
function vista(id){ document.querySelectorAll('.vista').forEach(v => v.classList.toggle('on', v.id === id)); }
function icono(nombre){ const n = norm(nombre); const k = Object.keys(ICONOS).find(x => n.includes(x)); return k ? ICONOS[k] : '🏪'; }

/* ================= COMUNICACIÓN ================= */
async function apiGet(params){
  const qs = new URLSearchParams({ ...params, token: cfg.token || '' });
  const j = await (await fetch(`${cfg.url}?${qs}`)).json();
  if(!j.ok) throw new Error(j.error || 'Error');
  return j;
}
async function apiPost(body){
  return (await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ ...body, token: cfg.token || '' }) })).json();
}

/* ================= DATOS (una sola carga, guardada en el teléfono) ================= */
let datos = LS.get('vv_datos', null), cargando = false;
function guardarDatos(){ LS.set('vv_datos', datos); }
function sucActual(){ return datos && datos.sucursales.find(s => s.nombre === sucursal); }

async function cargarTodo(fresco){
  if(cargando) return; cargando = true;
  const btns = [$('btnRecargar')]; btns.forEach(b => b && (b.textContent = '↻ Actualizando…'));
  if(!datos) $('listaSuc').innerHTML = '<div class="cargando"><div class="spin"></div>Cargando sucursales…</div>';
  try{
    datos = await apiGet({ action: 'todo', fresh: fresco ? '1' : '0' });
    guardarDatos();
    if(sucursal && sucActual()) abrirSucursal(sucursal, true); else pintarSucursales();
    if(fresco) toast('Datos actualizados', 'ok');
  }catch(e){
    if(!datos) $('listaSuc').innerHTML = `<div class="vacio"><b>⚠️</b>No se pudo conectar<br><small>${esc(e.message)}</small><br><br><button class="btn-gris" onclick="cargarTodo(true)">Reintentar</button></div>`;
    else toast('Sin conexión: mostrando los últimos datos', 'err');
  }finally{
    cargando = false; btns.forEach(b => b && (b.textContent = '↻ Recargar'));
  }
}

// Al volver a abrir la app (o regresar a la pestaña) trae los cambios de la hoja en segundo plano
async function revisarCambios(){
  if(!user || !cfg.url || document.visibilityState !== 'visible' || consultando) return;
  consultando = true;
  try{
    const e = await apiGet({ action: 'estado' });
    const antes = JSON.stringify(locks.filter(l => l.hoja === sucursal));
    locks = e.locks || [];
    const u = e.ultimo;
    if(u && u.ts > ultimoVisto){
      if(ultimoVisto && u.sesion !== SESION && u.nombre) toast(`🔄 ${u.nombre} actualizó ${u.codigo}${u.hoja !== sucursal ? ' en ' + u.hoja : ''}`);
      ultimoVisto = u.ts;
    }
    if(datos && e.ver !== datos.ver){
      datos.ver = e.ver;
      if($('modalProd').style.display === 'flex') refrescoPendiente = true;
      else await cargarTodo(false);
    } else if(sucursal && $('modalProd').style.display !== 'flex' && antes !== JSON.stringify(locks.filter(l => l.hoja === sucursal))) {
      pintarLista();   // cambió quién está revisando qué
    }
  }catch(err){}
  finally{ consultando = false; }
}
setInterval(revisarCambios, CADA_SEG * 1000);

/* ===== Deslizar hacia abajo para actualizar ===== */
(() => {
  let y0 = null, dy = 0; const UMBRAL = 80, ptr = $('ptr');
  const abierto = () => document.querySelector('.modal[style*="flex"]') || $('drawer').classList.contains('on');
  document.addEventListener('touchstart', e => {
    if(!user || abierto() || window.scrollY > 0) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if(y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if(dy <= 0){ ptr.style.transform = 'translate(-50%,-60px)'; return; }
    const d = Math.min(dy, 140);
    ptr.style.transform = `translate(-50%,${d * 0.6 - 10}px)`;
    ptr.classList.toggle('listo', dy > UMBRAL);
    $('ptrTxt').textContent = dy > UMBRAL ? 'Suelta para actualizar' : 'Desliza para actualizar';
  }, { passive: true });
  document.addEventListener('touchend', async () => {
    if(y0 === null) return;
    const ir = dy > UMBRAL; y0 = null;
    if(!ir){ ptr.style.transform = 'translate(-50%,-60px)'; ptr.classList.remove('listo'); return; }
    ptr.classList.remove('listo'); ptr.classList.add('girando');
    ptr.style.transform = 'translate(-50%,24px)'; $('ptrTxt').textContent = 'Actualizando…';
    try{ await cargarTodo(true); }finally{
      ptr.classList.remove('girando'); ptr.style.transform = 'translate(-50%,-60px)';
    }
  });
})();

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && user && $('modalProd').style.display !== 'flex') cargarTodo(false);
});

/* ================= LOGIN ================= */
$('verPass').onclick = () => { const p = $('lPass'); p.type = p.type === 'password' ? 'text' : 'password'; };
$('lnkCfg').onclick = e => { e.preventDefault(); abrirCfg(); };
$('fLogin').onsubmit = async e => {
  e.preventDefault();
  const u = $('lUser').value.trim(), c = $('lPass').value;
  $('errLogin').style.display = 'none';
  if(!cfg.url){ abrirCfg(); return toast('Primero configura la conexión', 'err'); }
  if(!u || !c){ return mostrarErrLogin('Ingresa usuario y contraseña'); }
  const b = $('btnLogin'); b.disabled = true; b.textContent = 'VERIFICANDO…';
  try{
    const j = await apiPost({ action: 'login', usuario: u, clave: c });
    if(!j.ok) return mostrarErrLogin(j.error || 'No se pudo iniciar sesión');
    user = { usuario: j.usuario, nombre: j.nombre };
    LS.del('vv_user'); LS.set('vv_user', user, !$('lRec').checked);
    if(j.datos){ datos = j.datos; guardarDatos(); }
    $('lPass').value = '';
    entrar(!j.datos);
  }catch(err){ mostrarErrLogin('No se pudo conectar. Revisa tu internet.'); }
  finally{ b.disabled = false; b.textContent = 'INICIAR SESIÓN'; }
};
function mostrarErrLogin(m){ $('errLogin').textContent = m; $('errLogin').style.display = 'block'; }
function entrar(recargar = true){
  vista('vApp');
  $('dNombre').textContent = user.nombre;
  $('hola').textContent = `Hola, ${user.nombre.split(' ')[0]} 👋`;
  irInicio();
  if(recargar) cargarTodo(false);          // muestra lo guardado al instante y actualiza en segundo plano
}

/* ================= MENÚ ================= */
function menu(abrir){ $('velo').classList.toggle('on', abrir); $('drawer').classList.toggle('on', abrir); }
$('btnMenu').onclick = () => menu(true);
$('velo').onclick = () => menu(false);
$('mInicio').onclick = () => { menu(false); irInicio(); };
$('mRecargar').onclick = () => { menu(false); cargarTodo(true); };
$('mCfg').onclick = () => { menu(false); abrirCfg(); };
$('mSalir').onclick = () => { menu(false); LS.del('vv_user'); user = null; vista('vLogin'); };

/* ================= SUCURSALES ================= */
function irInicio(){
  sucursal = '';
  $('pLista').style.display = 'none'; $('pInicio').style.display = 'block'; $('btnBack').style.display = 'none';
  pintarSucursales();
}
$('btnBack').onclick = irInicio;

function pintarSucursales(){
  if(!datos){ $('listaSuc').innerHTML = '<div class="cargando"><div class="spin"></div>Cargando sucursales…</div>'; return; }
  $('ventanaTxt').textContent = datos.ventana ? `📅 Validando vencimientos de ${datos.ventana}` : '';
  if(!datos.sucursales.length){ $('listaSuc').innerHTML = '<div class="vacio"><b>📄</b>No se encontraron hojas con la tabla de vencidos</div>'; return; }
  $('listaSuc').innerHTML = datos.sucursales.map(s => `
    <div class="card-suc">
      <div class="em">${icono(s.nombre)}</div>
      <h3>${esc(s.nombre)}</h3>
      <p>Vencimientos de ${esc(s.ventana || datos.ventana || '')}</p>
      <span class="cnt ${s.pendientes ? 'pend' : ''}">${s.pendientes ? `${s.pendientes} pendientes de ${s.total}` : '✓ Todo actualizado'}</span>
      <button class="btn-verde" data-s="${esc(s.nombre)}">Iniciar Verificación</button>
    </div>`).join('');
  document.querySelectorAll('#listaSuc .btn-verde').forEach(b => b.onclick = () => abrirSucursal(b.dataset.s));
}

/* ================= PENDIENTES ================= */
function abrirSucursal(s, refresco){
  sucursal = s;
  const d = sucActual(); if(!d) return irInicio();
  productos = d.productos; total = d.total; pend = d.pendientes; ventanaTxt = d.ventana || datos.ventana || '';
  if(!refresco){
    $('pInicio').style.display = 'none'; $('pLista').style.display = 'block'; $('btnBack').style.display = 'block';
    $('rSuc').textContent = `${icono(s)} ${s}`;
    $('q').value = ''; $('qClear').style.display = 'none';
    window.scrollTo(0, 0);
  }
  pintarResumen(); pintarLista();
}
$('btnRecargar').onclick = () => cargarTodo(true);
function sincronizar(){ const d = sucActual(); if(d){ d.pendientes = pend; } guardarDatos(); }

function pintarResumen(){
  const hechos = total - pend, pct = total ? Math.round(hechos / total * 100) : 0;
  $('rTxt').textContent = `Vence ${ventanaTxt} · ${hechos} de ${total} actualizados · ${pend} pendientes`;
  $('rPct').textContent = pct + '%';
  $('rBar').style.width = pct + '%';
}
function pintarLista(){
  const q = norm($('q').value.trim());
  const f = q ? productos.filter(p => norm(p.codigo).includes(q) || norm(p.nombre).includes(q)) : productos;
  $('infoTxt').textContent = q ? `${f.length} resultado${f.length === 1 ? '' : 's'}` : `${productos.length} producto${productos.length === 1 ? '' : 's'} pendiente${productos.length === 1 ? '' : 's'}`;
  if(!productos.length){ $('lista').innerHTML = '<div class="vacio"><b>🎉</b>¡Todo actualizado en esta sucursal para este mes!</div>'; return; }
  if(!f.length){ $('lista').innerHTML = '<div class="vacio"><b>🔍</b>Sin coincidencias pendientes</div>'; return; }
  $('lista').innerHTML = f.slice(0, MAX_LISTA).map(p => {
    const tags = p.fechas.length > 1
      ? `<span class="tag multi">${p.fechas.length} fechas</span>` + p.fechas.map(x => `<span class="tag">${esc(x.fecha)}</span>`).join('')
      : `<span class="tag">Vence ${esc(p.fechas[0].fecha)}</span><span class="tag">Cant. actual ${esc(p.fechas[0].cantidad || 0)}</span>`;
    const lk = lockDe(p.codigo);
    const tagLock = lk ? `<span class="tag lock">🔒 ${esc(lk.nombre)} lo está revisando</span>` : '';
    return `<div class="prod ${lk ? 'bloq' : ''}" data-i="${productos.indexOf(p)}"><div class="t"><div class="cod">${esc(p.codigo)}</div><div class="nom">${esc(p.nombre)}</div><div class="tags">${tagLock}${tags}</div></div><div class="flecha">${lk ? '🔒' : '›'}</div></div>`;
  }).join('') + (f.length > MAX_LISTA ? `<div class="mas">Mostrando ${MAX_LISTA} de ${f.length}. Usa el buscador para encontrar el resto.</div>` : '');
  document.querySelectorAll('.prod').forEach(el => el.onclick = () => abrirProducto(+el.dataset.i));
}
$('q').oninput = () => { $('qClear').style.display = $('q').value ? 'block' : 'none'; pintarLista(); };
$('qClear').onclick = () => { $('q').value = ''; $('qClear').style.display = 'none'; pintarLista(); $('q').focus(); };

/* ================= FICHA DEL PRODUCTO ================= */
let prodActual = null, latido = null, abriendo = false;
async function abrirProducto(i){
  const p = productos[i]; if(!p || abriendo) return;
  const lk = lockDe(p.codigo);
  if(lk) return avisoOcupado(lk.nombre, lk.sesion === SESION);
  abriendo = true; toast('Abriendo…');
  try{
    const r = await apiPost({ action: 'bloquear', hoja: sucursal, codigo: p.codigo, usuario: user.usuario, nombre: user.nombre, sesion: SESION });
    if(!r.ok) return avisoOcupado(r.nombre, false, r.mismoUsuario);
  }catch(e){ return toast('Sin conexión: no se pudo abrir el producto', 'err'); }
  finally{ abriendo = false; }
  $('toast').className = 'toast';
  prodActual = p;
  clearInterval(latido);
  latido = setInterval(() => { if(prodActual) apiPost({ action: 'bloquear', hoja: sucursal, codigo: prodActual.codigo, usuario: user.usuario, nombre: user.nombre, sesion: SESION }).catch(()=>{}); }, 30000);
  mostrarFicha(p);
}
function avisoOcupado(nombre, yo, mismoUsuario){
  const quien = yo ? 'tú en otra pantalla' : mismoUsuario ? `${nombre} (en otra sesión)` : nombre;
  toast(`🔒 Este producto lo está revisando ${quien}`, 'err');
}
function mostrarFicha(p){
  $('mCod').textContent = p.codigo; $('mNom').textContent = p.nombre; $('mObs').value = '';
  const n = p.fechas.length;
  $('mAviso').style.display = n > 1 ? 'block' : 'none';
  $('mAviso').textContent = `⚠️ Hay ${n} fechas de vencimiento de este producto. Actualiza cada una.`;
  $('mFechas').innerHTML = p.fechas.map((f, k) => `
    <div class="bloque" id="b${k}">
      <div class="fh">
        <div class="fecha"><small>VENCE</small>${esc(f.fecha)}</div>
        <div class="actual">Cantidad actual<b>${esc(f.cantidad || 0)}</b></div>
      </div>
      <label>Cantidad nueva *</label>
      <div class="row">
        <input class="campo" id="c${k}" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
        <button type="button" class="btn-cero" id="z${k}">YA NO HAY (0)</button>
      </div>
      <label>Lote de esta fecha</label>
      <input class="campo" id="l${k}" placeholder="Obligatorio si hay unidades" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase">
      <div class="nota" id="m${k}"></div>
    </div>`).join('');
  p.fechas.forEach((f, k) => {
    const c = $('c' + k), l = $('l' + k), z = $('z' + k);
    const sync = () => {
      const v = c.value.trim(), cero = v !== '' && Number(v) === 0;
      l.disabled = cero; if(cero) l.value = '';
      z.classList.toggle('on', cero);
      $('m' + k).textContent = v === '' ? '' : cero ? 'Sin existencias: se guarda en 0 y sin lote' : 'Ingresa el lote de esta fecha';
      $('b' + k).classList.remove('err');
    };
    c.oninput = sync;
    z.onclick = () => { c.value = (c.value.trim() !== '' && Number(c.value) === 0) ? '' : '0'; sync(); };
    c.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); (l.disabled ? ($('c' + (k + 1)) || $('mSave')) : l).focus(); } };
  });
  $('modalProd').style.display = 'flex';
  setTimeout(() => $('c0').focus(), 250);
}
function cerrarProducto(){
  $('modalProd').style.display = 'none';
  clearInterval(latido);
  if(prodActual) apiPost({ action: 'liberar', hoja: sucursal, codigo: prodActual.codigo, sesion: SESION }).catch(()=>{});
  prodActual = null;
  if(refrescoPendiente){ refrescoPendiente = false; cargarTodo(false); }
}
// Si cierran la app con un producto abierto, se libera
window.addEventListener('pagehide', () => {
  if(prodActual && cfg.url) fetch(cfg.url, { method: 'POST', keepalive: true, body: JSON.stringify({ action: 'liberar', hoja: sucursal, codigo: prodActual.codigo, sesion: SESION, token: cfg.token || '' }) }).catch(()=>{});
});
$('mCancel').onclick = cerrarProducto;

$('mSave').onclick = async () => {
  const p = prodActual; if(!p) return;
  const items = []; let error = '';
  p.fechas.forEach((f, k) => {
    const c = $('c' + k), l = $('l' + k), v = c.value.trim();
    if(v === '' || isNaN(v) || Number(v) < 0 || !Number.isInteger(Number(v))){ marcar(c); $('b' + k).classList.add('err'); error = error || 'Ingresa la cantidad nueva de cada fecha'; return; }
    const cant = Number(v);
    if(cant > 0 && !l.value.trim()){ marcar(l); $('b' + k).classList.add('err'); error = error || `Falta el lote de la fecha ${f.fecha}`; return; }
    items.push({ codigo: p.codigo, fecha: f.fecha, cantidad: cant, lote: cant > 0 ? l.value.trim().toUpperCase() : '', obs: $('mObs').value.trim() });
  });
  if(error) return toast(error, 'err');

  const btn = $('mSave'); btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    const j = await apiPost({ action: 'actualizar', hoja: sucursal, items, usuario: user.usuario, nombre: user.nombre, sesion: SESION });
    if(!j.resultados) throw new Error(j.error || 'Error al guardar');
    const okF = j.resultados.filter(r => r.ok).map(r => r.fecha);
    const fallos = j.resultados.filter(r => !r.ok);
    p.fechas = p.fechas.filter(f => !okF.includes(f.fecha));
    pend = Math.max(0, pend - okF.length);
    if(!p.fechas.length && productos.indexOf(p) !== -1) productos.splice(productos.indexOf(p), 1);
    sincronizar();
    pintarResumen(); pintarLista();
    if(fallos.length){
      toast(`${fallos[0].fecha}: ${fallos[0].error}`, 'err');
      p.fechas.length ? mostrarFicha(p) : cerrarProducto();
    } else {
      cerrarProducto();
      toast(`✓ ${p.codigo} actualizado`, 'ok');
      $('q').value = ''; $('qClear').style.display = 'none'; pintarLista();
    }
  }catch(e){
    toast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.', 'err');
  }finally{ btn.disabled = false; btn.textContent = 'Guardar'; }
};

/* ================= CONFIGURACIÓN ================= */
function abrirCfg(){ $('cfgUrl').value = cfg.url || ''; $('cfgToken').value = cfg.token || ''; $('modalCfg').style.display = 'flex'; }
$('cfgClose').onclick = () => $('modalCfg').style.display = 'none';
$('cfgSave').onclick = () => {
  cfg.url = $('cfgUrl').value.trim(); cfg.token = $('cfgToken').value.trim(); LS.set('vv_cfg', cfg);
  $('modalCfg').style.display = 'none'; toast('Conexión guardada', 'ok');
  if(user) cargarTodo(true);
};
$('cfgTest').onclick = async () => {
  const url = $('cfgUrl').value.trim(); if(!url) return toast('Pega primero la URL', 'err');
  try{
    const j = await (await fetch(`${url}?token=${encodeURIComponent($('cfgToken').value.trim())}`)).json();
    j.ok ? toast(`Conectado a "${j.libro}" ✓`, 'ok') : toast(j.error || 'Respuesta inválida', 'err');
  }catch(e){ toast('No se pudo conectar. Revisa la URL.', 'err'); }
};
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if(e.target === m){ m.id === 'modalProd' ? cerrarProducto() : (m.style.display = 'none'); } }));

/* ================= INSTALAR (PWA) ================= */
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
let promptInstalar = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); promptInstalar = e;
  $('btnInstalar').style.display = 'block'; $('mInstalar').style.display = 'flex';
});
async function instalar(){
  menu(false);
  if(!promptInstalar){
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    return toast(ios ? 'En iPhone: toca Compartir ⬆️ y luego "Agregar a inicio"' : 'Usa el menú ⋮ de Chrome → "Instalar app"');
  }
  promptInstalar.prompt();
  const r = await promptInstalar.userChoice;
  if(r.outcome === 'accepted') toast('¡App instalada! ✓', 'ok');
  promptInstalar = null; $('btnInstalar').style.display = 'none'; $('mInstalar').style.display = 'none';
}
$('btnInstalar').onclick = instalar; $('mInstalar').onclick = instalar;
window.addEventListener('appinstalled', () => { $('btnInstalar').style.display = 'none'; $('mInstalar').style.display = 'none'; });

/* ================= INICIO ================= */
if(user) entrar(); else { vista('vLogin'); if(cfg.url) fetch(cfg.url).catch(()=>{}); }   // despierta el servidor mientras escriben la clave
</script>
